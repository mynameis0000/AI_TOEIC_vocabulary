<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Vocabulary App</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

    <!-- LEFT CHAT SECTION -->
    <div class="sidebar">

        <div class="logo-section">
            <h1>AI Vocabulary</h1>
            <p>AI와 함께 단어를 학습해보세요.</p>
        </div>

        <div class="chat-area" id="chatArea">

            <!-- 기본 AI 메시지 -->
            <div class="bot-message">
                안녕하세요 👋<br>
                영어 단어를 입력해보세요!
            </div>

        </div>

        <div class="input-area">

            <textarea
                id="wordInput"
                placeholder="영어 단어 입력..."
        ></textarea>

            <button id="sendButton">
                ➤
            </button>

        </div>

    </div>

    <!-- RIGHT CONTENT -->
    <div class="content">

        <button id="swapButton">
            📚 단어장 보기
        </button>

        <div class="word-panel">

            <h2>Saved Words</h2>

            <div id="wordList"></div>

        </div>

    </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
